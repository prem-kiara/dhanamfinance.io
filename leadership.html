  <style>
    .contact-modal { position: fixed; inset: 0; z-index: 10040; display: none; align-items: center; justify-content: center; padding: 24px; }
    .contact-modal.is-open { display: flex; }
    .contact-modal__backdrop { position: absolute; inset: 0; background: rgba(15, 26, 46, 0.55); backdrop-filter: blur(2px); }
    .contact-modal__panel {
      position: relative; background: #fff; width: 100%; max-width: 460px;
      border-radius: 14px; padding: 28px 28px 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      animation: contactModalIn 0.22s ease;
    }
    @keyframes contactModalIn { from { transform: translateY(12px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
    .contact-modal__close {
      position: absolute; top: 12px; right: 12px;
      background: transparent; border: none; cursor: pointer;
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--gray-600, #555);
    }
    .contact-modal__close:hover { background: rgba(0,0,0,0.06); color: var(--navy, #0F1A2E); }
    .contact-modal__title { margin: 0 32px 6px 0; font-family: "DM Serif Display", Georgia, serif; font-size: 1.35rem; color: var(--navy, #0F1A2E); }
    .contact-modal__subtitle { margin: 0 0 18px; color: var(--gray-600, #555); font-size: 0.95rem; line-height: 1.55; }
    .contact-modal__actions { display: flex; flex-direction: column; gap: 12px; }
    .contact-modal__cta {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: 10px;
      text-decoration: none; color: #fff;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .contact-modal__cta:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); filter: brightness(1.05); }
    .contact-modal__cta--whatsapp { background: #25D366; }
    .contact-modal__cta--call { background: var(--primary, #B8860B); }
    .contact-modal__cta-label { display: block; font-size: 0.78rem; opacity: 0.9; font-weight: 500; }
    .contact-modal__cta-value { display: block; font-size: 1.05rem; }
    body.contact-modal-open { overflow: hidden; }
  </style>
  <script>
    (function () {
      var modal = document.getElementById('contact-modal');
      if (!modal) return;
      var titleEl = modal.querySelector('#contact-modal-title');
      var defaultTitle = titleEl ? titleEl.textContent : 'Contact us for details';
      function openFor(trigger) {
        if (titleEl) {
          var t = trigger && trigger.getAttribute && trigger.getAttribute('data-modal-title');
          titleEl.textContent = t || defaultTitle;
        }
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('contact-modal-open');
      }
      function close() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('contact-modal-open');
      }
      // Event delegation so dynamically added triggers also work.
      document.addEventListener('click', function (e) {
        var opener = e.target.closest && e.target.closest('[data-open-contact-modal]');
        if (opener) { e.preventDefault(); openFor(opener); return; }
        var closer = e.target.closest && e.target.closest('[data-close-contact-modal]');
        if (closer) { e.preventDefault(); close(); }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.classList.contains('is-open')) close();
      });
    })();
  </script>
